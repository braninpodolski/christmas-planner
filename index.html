<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Christmas</title>
<meta name="description" content="Personal Christmas planning and gift tracking">
<meta name="theme-color" content="#FCFDFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1713" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Christmas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FCFDFC;
  --sunken: #EFF3F0;
  --field: #FFFFFF;
  --press: rgba(23,59,47,.06);
  --ink: #15281F;
  --text: #1A2721;
  --text2: rgba(26,39,33,.58);
  --text3: rgba(26,39,33,.3);
  --hair: rgba(21,40,31,.12);
  --glass: rgba(252,253,252,.72);
  --glass-edge: rgba(21,40,31,.08);
  /* Liquid Glass material */
  --g-fill: rgba(255,255,255,.52);
  --g-fill-strong: rgba(255,255,255,.7);
  --g-filter: blur(16px) saturate(190%) brightness(1.04);
  --g-rim: inset 0 0 0 .5px rgba(255,255,255,.7), inset 0 1px 1px rgba(255,255,255,.9), inset 0 -1px 1px rgba(21,40,31,.05);
  --g-lift: 0 8px 24px -10px rgba(16,40,30,.28), 0 1px 3px rgba(16,40,30,.08);
  --edge-tint: rgba(252,253,252,.62);
  --fir: #173B2F;
  --fir-2: #21503E;
  --on-fir: #F1F6F2;
  --on-fir2: rgba(241,246,242,.68);
  --cranberry: #C8243F;
  --cranberry-hi: #E0435C;
  --brass: #A97C22;
  --brass-hi: #E6C478;
  --pine: #2F7D5B;
  --s-idea: #8E9C95;
  --s-started: #A97C22;
  --s-have: #2F7D5B;
  --s-wrapped: #C8243F;
  --serif: "Gloock", "Iowan Old Style", Georgia, serif;
  --ease: cubic-bezier(.32,.72,0,1);
  --spring: cubic-bezier(.34,1.5,.64,1);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --nav-h: 44px;
  --dock-b: max(var(--safe-b), 14px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0C1713;
    --sunken: #15241E;
    --field: #172922;
    --press: rgba(230,236,232,.06);
    --ink: #EEF3F0;
    --text: #E6ECE8;
    --text2: rgba(230,236,232,.6);
    --text3: rgba(230,236,232,.3);
    --hair: rgba(230,236,232,.11);
    --glass: rgba(20,36,30,.72);
    --glass-edge: rgba(230,236,232,.08);
    --g-fill: rgba(44,64,56,.42);
    --g-fill-strong: rgba(44,64,56,.62);
    --g-filter: blur(16px) saturate(170%) brightness(1.08);
    --g-rim: inset 0 0 0 .5px rgba(255,255,255,.12), inset 0 1px 1px rgba(255,255,255,.16), inset 0 -1px 1px rgba(0,0,0,.2);
    --g-lift: 0 8px 24px -10px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.3);
    --edge-tint: rgba(12,23,19,.55);
    --fir: #163A2D;
    --fir-2: #1F4B3A;
    --cranberry: #F0506A;
    --cranberry-hi: #F3687F;
    --brass: #E2BF6A;
    --pine: #5DBB8E;
    --s-idea: #74867D;
    --s-started: #E2BF6A;
    --s-have: #5DBB8E;
    --s-wrapped: #F0506A;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
body {
  font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  letter-spacing: -.41px; color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%;
}
input, textarea, select, button { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { -webkit-user-select: text; user-select: text; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--cranberry); outline-offset: 2px; border-radius: 6px; }
.serif { font-family: var(--serif); font-weight: 400; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Shell ---------- */
#app {
  position: fixed; inset: 0; background: var(--bg); overflow: hidden;
  transition: transform .5s var(--ease), border-radius .5s var(--ease), filter .5s var(--ease);
  transform-origin: 50% 0;
}
body.sheet-open #app { transform: translateY(calc(var(--safe-t) + 6px)) scale(.93); border-radius: 18px; filter: brightness(.82); }
@media (prefers-color-scheme: dark) { body.sheet-open #app { filter: brightness(.55); } }
.tab { position: absolute; inset: 0; visibility: hidden; opacity: 0; transition: opacity .16s ease, visibility 0s .16s; }
.tab.active { visibility: visible; opacity: 1; transition: opacity .16s ease; }
.page { position: absolute; inset: 0; background: var(--bg); will-change: transform; }
.page.under { transform: translateX(-28%); }
.page.under::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.06); pointer-events: none; }
.page.anim { transition: transform .5s var(--ease); }
.page.offright { transform: translateX(100%); }
.page.edge-shadow { box-shadow: -1px 0 24px rgba(0,0,0,.14); }
.scroll {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  padding: calc(var(--safe-t) + var(--nav-h)) 0 calc(var(--dock-b) + 110px);
}
.scroll::-webkit-scrollbar { display: none; }
.content { max-width: 640px; margin: 0 auto; }

/* ---------- Nav bar ---------- */
.navbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 10;
  height: calc(var(--safe-t) + var(--nav-h)); padding-top: var(--safe-t);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
}
/* Scroll edge effect: content softly blurs and fades as it slides under the
   controls. Two stacked layers make the blur progressive, with no hard edge. */
.navbar::before, .navbar::after {
  content: ""; position: absolute; left: 0; right: 0; top: 0; z-index: -1; pointer-events: none;
  opacity: 0; transition: opacity .35s var(--ease);
}
.navbar::before {
  bottom: -34px;
  background: linear-gradient(to bottom, var(--edge-tint), transparent);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  -webkit-mask-image: linear-gradient(to bottom, #000 40%, transparent);
  mask-image: linear-gradient(to bottom, #000 40%, transparent);
}
.navbar::after {
  bottom: -6px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent);
  mask-image: linear-gradient(to bottom, #000 30%, transparent);
}
.navbar.scrolled::before, .navbar.scrolled::after { opacity: 1; }
.nav-title { font-weight: 600; opacity: 0; transform: translateY(5px); transition: opacity .22s, transform .22s var(--ease); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56vw; color: var(--ink); }
.navbar.collapsed .nav-title { opacity: 1; transform: none; }
.nav-left { justify-self: start; padding-left: 16px; display: flex; }
.nav-right { justify-self: end; padding-right: 16px; display: flex; gap: 10px; align-items: center; }
.glass {
  background: var(--g-fill);
  -webkit-backdrop-filter: var(--g-filter); backdrop-filter: var(--g-filter);
  box-shadow: var(--g-rim), var(--g-lift);
}
.nav-btn {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  height: 40px; min-width: 40px; border-radius: 20px; color: var(--ink);
  font-size: 16px; font-weight: 600; letter-spacing: -.3px;
  transition: transform .4s var(--spring), background .25s;
}
.nav-btn:active { transform: scale(.88); background: var(--g-fill-strong); }
.nav-btn svg { width: 21px; height: 21px; }
.nav-btn.text { padding: 0 16px; }
.nav-btn.back svg { width: 11px; height: 18px; margin-left: -2px; }

.large-title { font-family: var(--serif); font-weight: 400; font-size: 38px; line-height: 1.05; letter-spacing: -.3px; color: var(--ink); margin: 4px 20px 18px; }

/* ---------- Dock: floating tab capsule + add button ---------- */
.dock {
  position: fixed; z-index: 50; left: 0; right: 0; bottom: var(--dock-b);
  display: flex; justify-content: center; gap: 10px; padding: 0 16px; pointer-events: none;
  transition: transform .45s var(--ease);
}
body.sheet-open .dock, body.menu-open .dock { transform: translateY(140%); }
.dock::before {
  content: ""; position: fixed; left: 0; right: 0; bottom: calc(-1 * var(--dock-b)); height: calc(var(--dock-b) + 96px); z-index: -1; pointer-events: none;
  background: linear-gradient(to top, var(--edge-tint), transparent);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  -webkit-mask-image: linear-gradient(to top, #000 35%, transparent); mask-image: linear-gradient(to top, #000 35%, transparent);
}
.capsule, .fab { pointer-events: auto; }
.capsule {
  position: relative; display: grid; grid-template-columns: repeat(4, 1fr); flex: 1; max-width: 360px; height: 60px; padding: 4px;
  border-radius: 30px; background: var(--g-fill);
  -webkit-backdrop-filter: var(--g-filter); backdrop-filter: var(--g-filter);
  box-shadow: var(--g-rim), var(--g-lift);
}
.capsule-thumb {
  position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 4);
  border-radius: 26px; background: rgba(21,40,31,.07);
  box-shadow: inset 0 0 0 .5px rgba(255,255,255,.5);
  transform: translateX(calc(100% * var(--i, 0))); transition: transform .55s var(--spring);
}
@media (prefers-color-scheme: dark) { .capsule-thumb { background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.08); } }
.capsule button {
  position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--text2); font-size: 10.5px; font-weight: 600; letter-spacing: 0; border-radius: 26px;
  transition: color .25s;
}
.capsule button svg { width: 24px; height: 24px; transition: transform .4s var(--spring); }
.capsule button.active { color: var(--cranberry); }
.capsule button:active svg { transform: scale(.84); }
.fab {
  width: 60px; height: 60px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--cranberry); color: #fff;
  background: linear-gradient(180deg, color-mix(in srgb, var(--cranberry) 82%, #fff), var(--cranberry) 55%);
  box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35), inset 0 1px 1px rgba(255,255,255,.5), 0 10px 24px -8px color-mix(in srgb, var(--cranberry) 70%, transparent);
  transition: transform .4s var(--spring), opacity .3s, scale .3s var(--ease);
}
.fab svg { width: 26px; height: 26px; transition: transform .45s var(--spring); }
.fab:active { transform: scale(.9); }
.fab:active svg { transform: rotate(90deg); }
.fab.hidden { scale: 0; opacity: 0; pointer-events: none; }

/* ---------- Gift tag (signature shape) ----------
   Geometry is driven by height (--h) so the point, the punched hole and the
   text inset stay in proportion at every size, whatever the width. */
.tag {
  --c: var(--fir);
  --h: 30px;
  --p: calc(var(--h) * .42);              /* depth of the pointed end */
  --hx: calc(var(--p) * .74);             /* hole centre, inside the point */
  --hr: calc(var(--h) * .078);            /* hole radius */
  --ring: max(1px, calc(var(--h) * .03)); /* reinforcement ring */
  position: relative; flex: none; width: calc(var(--h) * 1.6); height: var(--h);
  display: grid; place-items: center;
  padding-left: calc(var(--p) + var(--h) * .02);
  background: var(--c); color: #fff;
  border-radius: calc(var(--h) * .11);
  clip-path: polygon(var(--p) 0, 100% 0, 100% 100%, var(--p) 100%, calc(var(--h) * .035) calc(50% + var(--h) * .05), calc(var(--h) * .035) calc(50% - var(--h) * .05));
  -webkit-mask: radial-gradient(circle at var(--hx) 50%, transparent var(--hr), #000 calc(var(--hr) + .7px));
  mask: radial-gradient(circle at var(--hx) 50%, transparent var(--hr), #000 calc(var(--hr) + .7px));
  font-family: var(--serif); font-size: calc(var(--h) * .5); line-height: 1; letter-spacing: 0;
}
.tag::before {
  content: ""; position: absolute; top: 50%; left: var(--hx);
  width: calc((var(--hr) + var(--ring)) * 2); height: calc((var(--hr) + var(--ring)) * 2);
  transform: translate(-50%, -50%); border-radius: 50%;
  box-shadow: inset 0 0 0 var(--ring) rgba(255,255,255,.32);
  pointer-events: none;
}
.tag.emoji { font-family: inherit; font-size: calc(var(--h) * .52); }
@media (prefers-color-scheme: dark) { .tag { background: color-mix(in srgb, var(--c) 86%, #fff); } }
.tag.lg { --h: 74px; }
.tag.xl { --h: 90px; }

/* ---------- Sections & rows (flush, Things-like) ---------- */
.block { margin: 0 0 30px; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 20px 6px; }
.block-head h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 23px; letter-spacing: -.1px; color: var(--ink); line-height: 1.2; }
.block-head .meta { color: var(--text2); font-size: 15px; letter-spacing: -.24px; }
.link { color: var(--cranberry); font-size: 15px; font-weight: 600; letter-spacing: -.24px; }
.link:active { opacity: .4; }
.note { padding: 8px 20px 0; color: var(--text2); font-size: 13px; letter-spacing: -.08px; line-height: 1.4; -webkit-user-select: text; user-select: text; }
.note a { color: var(--cranberry); }

.list { position: relative; }
.row {
  position: relative; display: flex; align-items: center; gap: 14px;
  min-height: 52px; padding: 11px 20px; background: var(--bg);
  transition: background .25s;
}
button.row, .row.tap { width: 100%; text-align: left; cursor: pointer; }
button.row:active, .row.tap:active { background: var(--press); transition: none; }
.list > :not(:last-child) .row::after, .list > .row:not(:last-child)::after {
  content: ""; position: absolute; left: var(--inset, 20px); right: 0; bottom: 0; height: .5px; background: var(--hair);
}
.row-main { flex: 1; min-width: 0; }
.row-title { overflow: hidden; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.row-sub { color: var(--text2); font-size: 15px; letter-spacing: -.24px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-end { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
.money { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -.2px; }
.chev { width: 8px; height: 14px; color: var(--text3); flex: none; }
.row.add { color: var(--cranberry); font-weight: 500; gap: 14px; }
.row.add .plus-dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--cranberry) 13%, transparent); }
.row.add .plus-dot svg { width: 13px; height: 13px; }
.row.danger { color: var(--cranberry); justify-content: center; font-weight: 500; }
.row-icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
.row-icon svg { width: 18px; height: 18px; }

/* Budget meter */
.meter { height: 4px; border-radius: 2px; background: var(--sunken); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; border-radius: 2px; background: var(--pine); transition: width .8s var(--ease); }
.meter.over i { background: var(--cranberry); }
.left { color: var(--pine); font-size: 13px; font-weight: 600; letter-spacing: -.08px; font-variant-numeric: tabular-nums; }
.left.over { color: var(--cranberry); }
.left.none { color: var(--text3); font-weight: 500; }

/* Status: four-step ribbon */
.status {
  --c: var(--s-idea); --n: 1;
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  font-size: 13px; font-weight: 600; letter-spacing: -.08px; color: var(--c);
  padding: 5px 9px 5px 8px; border-radius: 99px; background: color-mix(in srgb, var(--c) 11%, transparent);
  transition: color .3s, background .3s, transform .35s var(--spring);
}
button.status:active { transform: scale(.92); }
.pips { display: flex; gap: 2px; }
.pips i { width: 6px; height: 6px; border-radius: 1.5px; background: color-mix(in srgb, var(--c) 28%, transparent); transition: background .3s, transform .4s var(--spring); }
.s-idea { --c: var(--s-idea); } .s-started { --c: var(--s-started); } .s-have { --c: var(--s-have); } .s-wrapped { --c: var(--s-wrapped); }
.s-idea .pips i:nth-child(1),
.s-started .pips i:nth-child(-n+2),
.s-have .pips i:nth-child(-n+3),
.s-wrapped .pips i { background: var(--c); }
.status.bump .pips i { animation: pip .45s var(--spring); }
.status.bump .pips i:nth-child(2) { animation-delay: .03s; } .status.bump .pips i:nth-child(3) { animation-delay: .06s; } .status.bump .pips i:nth-child(4) { animation-delay: .09s; }
@keyframes pip { 40% { transform: scaleY(1.7); } }

/* ---------- Overview hero: the present ---------- */
.present {
  position: relative; margin: 0 14px 30px; border-radius: 26px; overflow: hidden;
  background: radial-gradient(120% 90% at 0% 0%, var(--fir-2), var(--fir) 60%);
  color: var(--on-fir); padding: 26px 82px 24px 22px; min-height: 260px;
  box-shadow: 0 20px 40px -24px rgba(16,45,33,.7);
}
@media (prefers-color-scheme: dark) { .present { box-shadow: 0 0 0 .5px rgba(230,191,106,.18); } }
.present .ribbon {
  position: absolute; top: 0; bottom: 0; right: 30px; width: 20px;
  background: linear-gradient(90deg, #A51A31, #D63850 45%, #B71F37);
  box-shadow: -1px 0 0 rgba(0,0,0,.12), 1px 0 0 rgba(0,0,0,.12);
  transform-origin: top;
}
.present .bow { position: absolute; top: 10px; right: -3px; width: 86px; height: 60px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); transform-origin: 50% 70%; }
.present h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 42px; line-height: 1.02; letter-spacing: -.4px; color: #fff; text-wrap: balance; }
.present p { margin: 16px 0 0; font-size: 17px; line-height: 1.42; color: var(--on-fir2); letter-spacing: -.3px; text-wrap: pretty; }
.present p b { color: var(--brass-hi); font-weight: 600; font-variant-numeric: tabular-nums; }
.present .spool { display: flex; height: 8px; gap: 3px; margin: 22px 0 10px; }
.present .spool i { display: block; height: 100%; border-radius: 4px; min-width: 0; transition: flex-grow .9s var(--ease); }
.present .spool.empty i { background: rgba(241,246,242,.14); flex: 1; }
.present .key { display: grid; grid-template-columns: repeat(2, max-content); gap: 6px 28px; font-size: 13px; color: var(--on-fir2); letter-spacing: -.08px; }
.present .key span { display: inline-flex; align-items: center; gap: 6px; }
.present .key i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.present .key b { color: var(--on-fir); font-weight: 600; font-variant-numeric: tabular-nums; }
.hero-colors { --h-idea: rgba(241,246,242,.38); --h-started: #E6C478; --h-have: #7FC9A2; --h-wrapped: #EE5A72; }

/* intro: ribbon drops in, bow ties, text settles — once per launch */
.intro .ribbon { animation: ribbon .9s var(--ease) both .1s; }
.intro .bow { animation: bow .8s var(--spring) both .6s; }
.intro h1, .intro p, .intro .spool, .intro .key { animation: settle .8s var(--ease) both; }
.intro p { animation-delay: .12s; } .intro .spool { animation-delay: .2s; } .intro .key { animation-delay: .26s; }
@keyframes ribbon { from { transform: scaleY(0); } }
@keyframes bow { from { transform: scale(0) rotate(-25deg); opacity: 0; } }
@keyframes settle { from { opacity: 0; transform: translateY(8px); } }

/* Tag shelf: people still to buy for */
.shelf { display: flex; gap: 12px; overflow-x: auto; padding: 6px 20px 8px; scroll-snap-type: x mandatory; scroll-padding: 20px; }
.shelf::-webkit-scrollbar { display: none; }
.shelf-tag { flex: none; scroll-snap-align: start; display: flex; flex-direction: column; align-items: flex-start; gap: 0; text-align: left; transition: transform .35s var(--spring); }
.shelf-tag:active { transform: scale(.95) rotate(-1deg); }
.shelf-tag .tag {
  --h: 92px; width: 200px; padding: 0 16px 0 calc(var(--p) + var(--h) * .2);
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 5px;
}
.shelf-tag .tag .nm { font-size: 19px; line-height: 1.12; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.shelf-tag .tag .sb { font-family: -apple-system, system-ui, sans-serif; font-size: 13px; letter-spacing: -.08px; opacity: .82; }
.shelf-tag .tag .em { margin-right: 5px; font-size: 14px; }

/* ---------- Person page ---------- */
.person-head { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 20px 24px; }
.person-head h1 { margin: 16px 0 2px; font-family: var(--serif); font-weight: 400; font-size: 36px; line-height: 1.05; color: var(--ink); }
.person-head .rel { color: var(--text2); font-size: 15px; letter-spacing: -.24px; }
.ledger { margin: 0 20px 30px; padding: 16px 0 0; border-top: .5px solid var(--hair); }
.ledger-row { display: flex; justify-content: space-between; align-items: baseline; }
.ledger .big { font-size: 30px; font-weight: 700; letter-spacing: -.6px; font-variant-numeric: tabular-nums; color: var(--ink); }
.ledger .of { color: var(--text2); font-size: 15px; letter-spacing: -.24px; }
.ledger .meter { height: 6px; border-radius: 3px; margin-top: 12px; }
.ledger .meter i { border-radius: 3px; }
.ledger .say { margin-top: 10px; font-size: 15px; letter-spacing: -.24px; color: var(--text2); }
.ledger .say b { font-weight: 600; color: var(--pine); }
.ledger .say b.over { color: var(--cranberry); }
.prose { padding: 0 20px; white-space: pre-wrap; color: var(--text); line-height: 1.45; -webkit-user-select: text; user-select: text; }

/* ---------- Search & filter chips ---------- */
.search { margin: 0 20px 12px; position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--text2); }
.search input { width: 100%; height: 40px; border: 0; border-radius: 20px; background: var(--sunken); padding: 0 14px 0 38px; outline: none; font-size: 17px; }
.search input::placeholder { color: var(--text2); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 20px 22px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 17px;
  font-size: 15px; font-weight: 500; letter-spacing: -.24px; color: var(--text);
  box-shadow: inset 0 0 0 1px var(--hair);
  transition: background .3s var(--ease), color .3s, box-shadow .3s, transform .3s var(--spring);
}
.chip:active { transform: scale(.94); }
.chip .ct { color: var(--text2); font-variant-numeric: tabular-nums; transition: color .3s; }
.chip .sw { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.chip.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.chip.on .ct { color: color-mix(in srgb, var(--bg) 65%, transparent); }
.group-head { display: flex; align-items: center; gap: 12px; padding: 0 20px 4px; }
.group-head .tag { --h: 25px; }
.group-head h2 { flex: 1; margin: 0; font-family: var(--serif); font-weight: 400; font-size: 21px; color: var(--ink); }

/* ---------- Swipe rows ---------- */
.swipe { position: relative; overflow: hidden; }
.swipe-actions { position: absolute; top: 0; right: 0; bottom: 0; display: flex; }
.swipe-actions button { width: 88px; background: var(--cranberry); color: #fff; font-size: 15px; font-weight: 600; }
.swipe-content { position: relative; z-index: 1; touch-action: pan-y; }
.swipe-content.snap { transition: transform .42s var(--ease); }

/* ---------- Tasks ---------- */
.check {
  position: relative; width: 22px; height: 22px; border-radius: 7px; flex: none;
  box-shadow: inset 0 0 0 1.6px var(--text3);
  display: grid; place-items: center; transition: background .25s, box-shadow .25s, transform .4s var(--spring);
}
.check svg { width: 13px; height: 13px; color: #fff; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .28s ease .06s; }
.done .check { background: var(--cranberry); box-shadow: none; }
.done .check svg { stroke-dashoffset: 0; }
.check:active { transform: scale(.82); }
.check .spark { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: var(--c, var(--brass)); pointer-events: none; animation: spark .55s var(--ease) forwards; }
@keyframes spark { from { transform: rotate(var(--a)) translateY(0) scale(1); opacity: 1; } to { transform: rotate(var(--a)) translateY(-19px) scale(.2); opacity: 0; } }
.task-title { transition: color .3s; }
.done .task-title { color: var(--text2); }
.due { font-size: 15px; color: var(--text2); letter-spacing: -.24px; font-variant-numeric: tabular-nums; flex: none; }
.due.late { color: var(--cranberry); font-weight: 500; }
.due.soon { color: var(--ink); font-weight: 500; }

/* ---------- Empty states ---------- */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 36px 36px 20px; }
.empty .tag { margin-bottom: 22px; transform: rotate(-8deg); animation: sway 5s ease-in-out infinite; transform-origin: 85% 50%; }
@keyframes sway { 50% { transform: rotate(-3deg); } }
.empty h3 { margin: 0 0 8px; font-family: var(--serif); font-weight: 400; font-size: 26px; color: var(--ink); line-height: 1.15; }
.empty p { margin: 0 0 22px; color: var(--text2); font-size: 15px; line-height: 1.45; letter-spacing: -.24px; max-width: 30ch; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 48px; padding: 0 24px;
  border-radius: 24px; background: var(--cranberry); color: #fff; font-weight: 600;
  transition: transform .35s var(--spring), opacity .2s;
}
.btn:active { transform: scale(.95); }
.btn.quiet { background: transparent; color: var(--cranberry); height: 40px; }

/* ---------- Enter animation for new rows ---------- */
.enter { animation: enter .55s var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(-10px); } }

/* ---------- Sheets ---------- */
.backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(5,20,14,.32); opacity: 0; transition: opacity .45s var(--ease); }
.backdrop.show { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 101; top: calc(var(--safe-t) + 16px);
  max-width: 640px; margin: 0 auto;
  background: var(--sunken); border-radius: 34px 34px 0 0; overflow: hidden;
  transform: translateY(105%); transition: transform .52s var(--ease);
  display: flex; flex-direction: column; box-shadow: 0 -6px 30px rgba(0,0,0,.16);
}
.sheet.show { transform: none; }
.sheet.dragging { transition: none; }
.sheet-head { flex: none; display: flex; align-items: center; justify-content: center; height: 56px; padding: 8px 16px 0; position: relative; touch-action: none; cursor: grab; }
.sheet-head::before { content: ""; position: absolute; top: 7px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--text3); }
.sheet-head h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 21px; color: var(--ink); }
.sheet-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  display: flex; gap: 10px; padding: 12px 16px calc(var(--dock-b) + 2px);
  transform: translateY(calc(-1 * var(--kb, 0px))); transition: transform .3s var(--ease);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  background: linear-gradient(to top, color-mix(in srgb, var(--sunken) 85%, transparent) 40%, transparent);
  -webkit-mask-image: linear-gradient(to top, #000 60%, transparent); mask-image: linear-gradient(to top, #000 60%, transparent);
}
.bar-btn { height: 54px; border-radius: 27px; font-size: 17px; font-weight: 600; letter-spacing: -.3px; transition: transform .35s var(--spring), opacity .25s, background .25s, color .25s; }
.bar-btn:active { transform: scale(.96); }
.bar-btn.ghost {
  flex: 0 0 auto; padding: 0 24px; color: var(--ink); background: var(--g-fill-strong);
  -webkit-backdrop-filter: var(--g-filter); backdrop-filter: var(--g-filter);
  box-shadow: var(--g-rim), var(--g-lift);
}
.bar-btn.primary {
  flex: 1; color: #fff;
  background: linear-gradient(180deg, color-mix(in srgb, var(--cranberry) 84%, #fff), var(--cranberry) 60%);
  box-shadow: inset 0 0 0 .5px rgba(255,255,255,.3), inset 0 1px 1px rgba(255,255,255,.45), 0 10px 22px -10px color-mix(in srgb, var(--cranberry) 80%, transparent);
}
.bar-btn.primary:disabled { background: color-mix(in srgb, var(--cranberry) 35%, var(--sunken)); box-shadow: none; color: rgba(255,255,255,.85); }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 0 calc(var(--dock-b) + 100px + var(--kb, 0px)); overscroll-behavior: contain; }
.fgroup { margin: 0 16px 22px; background: var(--field); border-radius: 20px; overflow: hidden; }
.fgroup > .row { background: var(--field); padding: 12px 16px; min-height: 50px; }
.fgroup > .row:not(:last-child)::after { left: 16px; }
.flabel { padding: 0 32px 7px; color: var(--text2); font-size: 13px; letter-spacing: -.08px; }
.fnote { padding: 0 32px; margin: -14px 0 22px; color: var(--text2); font-size: 13px; letter-spacing: -.08px; line-height: 1.45; -webkit-user-select: text; user-select: text; }
.fnote a { color: var(--cranberry); }
.field { width: 100%; border: 0; outline: none; background: transparent; padding: 0; min-height: 24px; }
.field::placeholder { color: var(--text3); }
.field.big { font-family: var(--serif); font-size: 24px; letter-spacing: 0; color: var(--ink); }
textarea.field { resize: none; min-height: 84px; line-height: 1.4; }
.row label.lbl { flex: none; min-width: 78px; color: var(--text); }
.row .field.right { text-align: right; }
.row select.field { -webkit-appearance: none; appearance: none; text-align: right; text-align-last: right; color: var(--text2); cursor: pointer; }
.row input[type=date].field { text-align: right; color: var(--text2); display: flex; justify-content: flex-end; }
.row input[type=date]::-webkit-date-and-time-value { text-align: right; }

/* Status stepper (in gift sheet) */
.stepper { --i: 0; position: relative; display: grid; grid-template-columns: repeat(4, 1fr); padding: 18px 8px 14px; }
.stepper::before, .stepper::after { content: ""; position: absolute; top: 29px; left: 12.5%; height: 3px; border-radius: 2px; }
.stepper::before { right: 12.5%; background: var(--sunken); }
.stepper::after { width: calc(75% * var(--i) / 3); background: var(--sc, var(--s-idea)); transition: width .55s var(--ease), background .4s; }
.stepper label { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 9px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); letter-spacing: -.08px; transition: color .3s; }
.stepper input { position: absolute; opacity: 0; pointer-events: none; }
.stepper .node { width: 25px; height: 25px; border-radius: 50%; background: var(--field); box-shadow: inset 0 0 0 2px var(--sunken); transition: background .35s, box-shadow .35s, transform .45s var(--spring); display: grid; place-items: center; }
.stepper .node::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform .4s var(--spring); }
.stepper label.reached .node { background: var(--sc); box-shadow: none; }
.stepper label.current { color: var(--ink); font-weight: 600; }
.stepper label.current .node { transform: scale(1.12); }
.stepper label.current .node::after { transform: scale(1); }

.kind { --i: 0; position: relative; display: grid; grid-template-columns: 1fr 1fr; margin: 12px 12px 0; padding: 3px; border-radius: 12px; background: var(--sunken); }
.kind-thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 9px; background: var(--field); box-shadow: 0 2px 8px rgba(0,0,0,.1); transform: translateX(calc(100% * var(--i))); transition: transform .45s var(--spring); }
@media (prefers-color-scheme: dark) { .kind-thumb { background: #2A3F36; } }
.kind label { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 36px; font-size: 15px; font-weight: 600; letter-spacing: -.24px; color: var(--text2); cursor: pointer; transition: color .25s; }
.kind label:has(input:checked) { color: var(--ink); }
.kind label svg { width: 17px; height: 17px; }
.kind input { position: absolute; opacity: 0; pointer-events: none; }
.kind label:has(input:focus-visible) { outline: 2px solid var(--cranberry); border-radius: 9px; }

/* Person sheet: live tag preview, palette */
.tag-preview { display: flex; justify-content: center; padding: 6px 0 22px; }
.tag-preview .tag { transition: background .35s var(--ease); }
.swatches { display: flex; justify-content: space-between; padding: 14px 16px; gap: 6px; }
.swatches label { cursor: pointer; }
.swatches input, .emoji-grid input { position: absolute; opacity: 0; pointer-events: none; }
.swatches span { display: block; width: 30px; height: 30px; border-radius: 50%; background: var(--c); transition: transform .35s var(--spring), box-shadow .2s; }
.swatches input:checked + span { box-shadow: 0 0 0 2.5px var(--field), 0 0 0 4.5px var(--c); transform: scale(.88); }
.swatches input:focus-visible + span, .emoji-grid input:focus-visible + span { outline: 2px solid var(--cranberry); outline-offset: 3px; }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; padding: 10px 12px 14px; box-shadow: 0 -.5px 0 var(--hair); }
.emoji-grid label { display: grid; place-items: center; cursor: pointer; }
.emoji-grid span { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; font-size: 22px; transition: background .2s, transform .35s var(--spring); }
.emoji-grid span.txt { font-family: var(--serif); font-size: 17px; color: var(--text2); }
.emoji-grid input:checked + span { background: var(--sunken); transform: scale(1.08); box-shadow: inset 0 0 0 2px var(--cranberry); }

/* ---------- Household ---------- */
.you { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0; vertical-align: 2px; color: var(--cranberry); background: color-mix(in srgb, var(--cranberry) 12%, transparent); }
.surprise { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8px 36px 30px; }
.surprise .tag { margin-bottom: 20px; transform: rotate(-6deg); }
.surprise .tag svg { width: 58px; height: 42px; }
.surprise h3 { margin: 0 0 8px; font-family: var(--serif); font-weight: 400; font-size: 24px; color: var(--ink); }
.surprise p { margin: 0; color: var(--text2); font-size: 15px; line-height: 1.45; max-width: 30ch; }
.whoami {
  position: fixed; inset: 0; z-index: 150; display: flex; flex-direction: column; padding: calc(var(--safe-t) + 32px) 20px calc(var(--safe-b) + 24px);
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  background: radial-gradient(130% 80% at 20% 0%, var(--fir-2), var(--fir) 70%); color: var(--on-fir);
  opacity: 0; transition: opacity .4s var(--ease); overflow-y: auto;
}
.whoami.show { opacity: 1; }
.whoami-inner { width: 100%; max-width: 420px; margin: auto; /* centers when short, scrolls from the top when tall */ display: flex; flex-direction: column; align-items: center; text-align: center; }
.whoami h1 { margin: 0 0 10px; font-family: var(--serif); font-weight: 400; font-size: 38px; line-height: 1.05; color: #fff; text-wrap: balance; }
.whoami p { margin: 0 0 26px; color: var(--on-fir2); font-size: 16px; line-height: 1.45; max-width: 30ch; }
.whoami-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-bottom: 18px; width: 100%; }
.whoami-tags.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.whoami-tags.grid .shelf-tag { width: 100%; }
.whoami .tag { background: color-mix(in srgb, var(--c) 78%, #fff); }
.whoami-tags.grid .shelf-tag .tag { --h: 80px; width: 100%; }
.whoami-tags.grid .shelf-tag .tag .nm { font-size: 18px; }
.whoami-tags .shelf-tag { animation: settle .6s var(--ease) both; }
.whoami .btn.quiet { color: var(--brass-hi); }

/* ---------- Action sheet & toast ---------- */
.action-sheet { position: fixed; left: 10px; right: 10px; bottom: calc(var(--dock-b) + 4px); z-index: 201; max-width: 520px; margin: 0 auto; transform: translateY(120%); transition: transform .45s var(--ease); }
.action-sheet.show { transform: none; }
.action-group {
  display: flex; flex-direction: column; gap: 6px; padding: 8px; margin-top: 8px; border-radius: 32px;
  background: var(--g-fill-strong); -webkit-backdrop-filter: var(--g-filter); backdrop-filter: var(--g-filter);
  box-shadow: var(--g-rim), var(--g-lift);
}
.action-group .msg { padding: 12px 18px 8px; text-align: center; color: var(--text2); font-size: 14px; letter-spacing: -.15px; line-height: 1.4; }
.action-group button { display: block; width: 100%; height: 52px; border-radius: 26px; font-size: 17px; font-weight: 600; letter-spacing: -.3px; color: var(--ink); background: rgba(21,40,31,.06); transition: transform .35s var(--spring), background .2s; }
@media (prefers-color-scheme: dark) { .action-group button { background: rgba(255,255,255,.08); } }
.action-group button.destructive { color: #fff; background: var(--cranberry); }
.action-group button:active { transform: scale(.97); }
.backdrop.top { z-index: 200; }
.toast {
  position: fixed; left: 50%; top: calc(var(--safe-t) + 10px); z-index: 300;
  transform: translate(-50%, -160%); opacity: 0; transition: transform .55s var(--spring), opacity .3s;
  background: var(--g-fill-strong); color: var(--ink);
  -webkit-backdrop-filter: var(--g-filter); backdrop-filter: var(--g-filter);
  box-shadow: var(--g-rim), var(--g-lift);
  border-radius: 99px; padding: 11px 18px 11px 14px; font-size: 15px; font-weight: 600; letter-spacing: -.24px;
  display: flex; align-items: center; gap: 9px; white-space: nowrap;
}
.toast svg { width: 18px; height: 18px; color: var(--pine); flex: none; }
.toast-act { margin: -6px -12px -6px 6px; padding: 6px 14px; color: #fff; background: var(--cranberry); font-weight: 700; border-radius: 99px; }
.toast-act:active { transform: scale(.94); }
.toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
</style>
</head>

<div id="app"><main id="tabs"></main></div>
<div class="dock" id="dock">
  <nav class="capsule" id="capsule"><span class="capsule-thumb"></span></nav>
  <button class="fab" id="fab" data-action="fab" aria-label="Add"></button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* =========================================================
   Utilities
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD', maximumFractionDigits: (n % 1) ? 2 : 0 }).format(n || 0);
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function words(n) {
  const a = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  const t = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  if (n < 20) return a[n];
  if (n < 100) return t[Math.floor(n / 10)] + (n % 10 ? '-' + a[n % 10] : '');
  return a[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' ' + words(n % 100) : '');
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const Icon = {
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.2l2.5 5.6 6.1.6-4.6 4.1 1.3 6-5.3-3.1-5.3 3.1 1.3-6L3.4 9.4l6.1-.6Z"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8.2 5h11.3c.8 0 1.5.7 1.5 1.5v11c0 .8-.7 1.5-1.5 1.5H8.2c-.4 0-.8-.2-1.1-.5L3.4 12.9a1.4 1.4 0 0 1 0-1.8l3.7-5.6c.3-.3.7-.5 1.1-.5Z"/><circle cx="8.6" cy="12" r="1.3"/></svg>',
  gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v7.5c0 .6.4 1 1 1h12c.6 0 1-.4 1-1V12M12 8v12.5"/><path d="M12 8C11 5 9.4 3.6 8 3.6c-1.2 0-2 .8-2 1.9C6 7.2 8 8 12 8Zm0 0c1-3 2.6-4.4 4-4.4 1.2 0 2 .8 2 1.9C18 7.2 16 8 12 8Z"/></svg>',

   State
   ========================================================= */
const KEY = 'xmas-planner-v1';
// Generic labels (used for filters and the overview); each gift shows labels for its own kind.
const STATUSES = [
  { id: 'idea', label: 'Ideas' },
  { id: 'started', label: 'In progress' },
  { id: 'have', label: 'In hand' },
  { id: 'wrapped', label: 'Wrapped' },
];
const KIND_STEPS = {
  buy: ['Idea', 'Ordered', 'In hand', 'Wrapped'],
  make: ['Idea', 'Making', 'Finished', 'Wrapped'],
};
const stepLabel = (kind, id) => KIND_STEPS[kind === 'make' ? 'make' : 'buy'][Math.max(0, ['idea', 'started', 'have', 'wrapped'].indexOf(id))];
const LEGACY_STATUS = { bought: 'have', given: 'wrapped' };
const STATUS_IDS = STATUSES.map(s => s.id);
const CATEGORIES = ['Shopping', 'Decorating', 'Food', 'Cards', 'Events', 'Other'];
const COLORS = ['#173B2F', '#2F7D5B', '#1E6F86', '#3B4F9A', '#6D3F8F', '#A3264A', '#C8243F', '#B8782A'];
const EMOJIS = ['', '🎅', '🤶', '👶', '👧', '👦', '👩', '👨', '👵', '👴', '🐶', '🐱', '⭐️', '❄️', '🦌', '⛄️', '🎄', '🍪', '🔔', '🧸', '🎁', '🕯️', '🎿', '🎮'];

const blank = () => ({ version: 2, updatedAt: 0, people: [], gifts: [], tasks: [], deleted: {}, household: { on: false, mod: 0 } });
const KINDS = ['people', 'gifts', 'tasks'];

/* Normalize any data entering the app (localStorage, imported file, synced Gist)
   so ids, enums and colors can never carry markup into rendered HTML. */
const ID_RE = /^[a-z0-9]{1,40}$/i;
const str = (v, max = 2000) => (typeof v === 'string' ? v : v == null ? '' : String(v)).slice(0, max);
const cleanId = v => (typeof v === 'string' && ID_RE.test(v) ? v : uid());
const priceOf = v => (v === '' || v == null ? '' : Math.max(0, num(v)));
const dateOf = v => (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '');
function sanitize(raw) {
  const s = blank();
  if (!raw || typeof raw !== 'object') return s;
  s.updatedAt = Number(raw.updatedAt) || 0;
  const arr = a => (Array.isArray(a) ? a.filter(x => x && typeof x === 'object') : []);
  s.people = arr(raw.people).map(p => ({
    id: cleanId(p.id), created: Number(p.created) || 0,
    name: str(p.name, 100) || 'Unnamed', relation: str(p.relation, 100), budget: priceOf(p.budget),
    color: COLORS.includes(p.color) ? p.color : COLORS[0],
    emoji: EMOJIS.includes(p.emoji) ? p.emoji : '',
    notes: str(p.notes), sizes: str(p.sizes),
  }));
  const ids = new Set(s.people.map(p => p.id));
  s.gifts = arr(raw.gifts).filter(g => ids.has(g.personId)).map(g => ({
    id: cleanId(g.id), created: Number(g.created) || 0, personId: g.personId,
    title: str(g.title, 200) || 'Gift', price: priceOf(g.price), buyer: ids.has(g.buyer) ? g.buyer : '',
    status: STATUS_IDS.includes(g.status) ? g.status : (LEGACY_STATUS[g.status] || 'idea'),
    kind: g.kind === 'make' ? 'make' : 'buy',
    store: str(g.store, 100), url: str(g.url, 2000), notes: str(g.notes),
  }));
  s.tasks = arr(raw.tasks).map(t => ({
    id: cleanId(t.id), created: Number(t.created) || 0, done: !!t.done,
    title: str(t.title, 200) || 'Task', category: CATEGORIES.includes(t.category) ? t.category : 'Other',
    due: dateOf(t.due), notes: str(t.notes),
  }));
  // per-record modification time + deletion tombstones power the sync merge
  const mods = new Map();
  KINDS.forEach(k => arr(raw[k]).forEach(r => typeof r.id === 'string' && mods.set(r.id, Number(r.mod) || 0)));
  KINDS.forEach(k => s[k].forEach(r => { r.mod = mods.get(r.id) || 0; }));
  if (raw.household && typeof raw.household === 'object') s.household = { on: !!raw.household.on, mod: Number(raw.household.mod) || 0 };
  const cutoff = Date.now() - 90 * 86400000;
  if (raw.deleted && typeof raw.deleted === 'object') {
    for (const [id, t] of Object.entries(raw.deleted)) if (ID_RE.test(id) && Number(t) > cutoff) s.deleted[id] = Number(t);
  }
  return s;
}

/* Record-level merge: newest edit of each item wins; deletions win over older edits. */
function merge(a, b) {
  const out = blank();
  out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  out.deleted = { ...a.deleted };
  out.household = (b.household?.mod || 0) > (a.household?.mod || 0) ? { ...b.household } : { ...a.household };
  for (const [id, t] of Object.entries(b.deleted || {})) out.deleted[id] = Math.max(out.deleted[id] || 0, t);
  KINDS.forEach(k => {
    const m = new Map(a[k].map(r => [r.id, r]));
    b[k].forEach(r => { const x = m.get(r.id); if (!x || (r.mod || 0) > (x.mod || 0)) m.set(r.id, r); });
    out[k] = [...m.values()].filter(r => !((out.deleted[r.id] || 0) >= (r.mod || 0) && out.deleted[r.id]));
  });
  const pids = new Set(out.people.map(p => p.id));
  out.gifts = out.gifts.filter(g => pids.has(g.personId));
  return out;
}
const canon = s => JSON.stringify([s.household, KINDS.map(k => [...s[k]].sort((x, y) => x.id < y.id ? -1 : 1)), Object.keys(s.deleted).sort().map(k => [k, s.deleted[k]])]);
function load() { try { return sanitize(JSON.parse(localStorage.getItem(KEY))); } catch { return blank(); } }
let state = load();
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

const ui = { giftFilter: 'all', giftQuery: '', justAdded: null, introPlayed: false };

function commit(fn, { render = true } = {}) {
  const key = (k, r) => k + ':' + r.id;
  const sig = r => JSON.stringify({ ...r, mod: 0 });
  const before = new Map();
  KINDS.forEach(k => state[k].forEach(r => before.set(key(k, r), sig(r))));
  const hh = state.household.on;
  fn(state);
  if (state.household.on !== hh) state.household.mod = Date.now();
  const now = Date.now(), seen = new Set();
  KINDS.forEach(k => state[k].forEach(r => {
    const kk = key(k, r); seen.add(kk);
    if (before.get(kk) !== sig(r)) r.mod = now;
  }));
  for (const kk of before.keys()) if (!seen.has(kk)) state.deleted[kk.split(':')[1]] = now;
  state.updatedAt = now;
  saveLocal();
  Sync.schedule();
  if (render) renderAll();
}

let me = (() => { try { return localStorage.getItem('xmas-me') || ''; } catch { return ''; } })();
function setMe(id) { me = id || ''; try { id ? localStorage.setItem('xmas-me', id) : localStorage.removeItem('xmas-me'); } catch {} }
const person = id => state.people.find(p => p.id === id);
const sharing = () => state.household.on;
const isMe = id => sharing() && !!me && id === me;
const needsIdentity = () => sharing() && !person(me);
/* Gifts someone else is buying for the person using this device are never shown here. */
const visibleGifts = () => needsIdentity() ? [] : state.gifts.filter(g => !(isMe(g.personId) && g.buyer !== me));
const giftsFor = id => visibleGifts().filter(g => g.personId === id);
const isSpent = g => g.status !== 'idea';
const isReady = g => g.status === 'wrapped';
const spentFor = id => giftsFor(id).filter(isSpent).reduce((a, g) => a + num(g.price), 0);
const sortedPeople = () => [...state.people].sort((a, b) => a.name.localeCompare(b.name));
const shoppablePeople = () => sortedPeople().filter(p => !isMe(p.id));
const budgetTotal = () => shoppablePeople().reduce((a, p) => a + num(p.budget), 0);
const statusIndex = id => Math.max(0, STATUS_IDS.indexOf(id));

function christmas() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let y = now.getFullYear();
  let xmas = new Date(y, 11, 25);
  if (today > xmas) xmas = new Date(++y, 11, 25);
  return { days: Math.round((xmas - today) / 86400000), year: y };
}

function tag(p, cls = '') {
  if (!p) return `<span class="tag ${cls}" style="--c:var(--s-idea)">?</span>`;
  const initial = (p.name.trim()[0] || '?').toUpperCase();
  return p.emoji
    ? `<span class="tag emoji ${cls}" style="--c:${p.color}" aria-hidden="true">${esc(p.emoji)}</span>`
    : `<span class="tag ${cls}" style="--c:${p.color}" aria-hidden="true">${esc(initial)}</span>`;
}
function statusChip(g, tappable = true) {
  const id = STATUS_IDS[statusIndex(g.status)];
  const label = stepLabel(g.kind, id);
  const inner = `<span class="pips"><i></i><i></i><i></i><i></i></span><span class="st-l">${label}</span>`;
  const hint = id === 'wrapped' ? 'Ready to give' : 'Tap to move to the next step';
  return tappable
    ? `<button class="status s-${id}" data-action="cycle" data-id="${esc(g.id)}" aria-label="${label}. ${hint}">${inner}</button>`
    : `<span class="status s-${id}">${inner}</span>`;
}
function leftLabel(spent, budget) {
  if (!budget) return `<span class="left none">No budget</span>`;
  const d = budget - spent;
  return d >= 0 ? `<span class="left">${money(d)} left</span>` : `<span class="left over">${money(-d)} over</span>`;
}

function byDue(a, b) {
  if (a.due && b.due) return a.due.localeCompare(b.due);
  if (a.due) return -1; if (b.due) return 1;
  return (a.created || 0) - (b.created || 0);
}
function dueInfo(d) {
  if (!d) return null;
  const dt = new Date(d + 'T00:00');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((dt - today) / 86400000);
  const label = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : diff === -1 ? 'Yesterday' : dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  return { label, diff };
}
function timeAgo(t) {
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} hr ago`;
  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function taskRow(t) {
  const d = dueInfo(t.due);
  const cls = !d || t.done ? '' : d.diff < 0 ? 'late' : d.diff <= 2 ? 'soon' : '';
  return `
    <div class="swipe ${ui.justAdded === t.id ? 'enter' : ''}">
      <div class="swipe-actions"><button data-action="delete-task" data-id="${esc(t.id)}">Delete</button></div>
      <div class="swipe-content">
        <div class="row ${t.done ? 'done' : ''}" data-task="${esc(t.id)}">
          <button class="check" data-action="toggle-task" data-id="${esc(t.id)}" aria-label="${t.done ? 'Mark as not done' : 'Mark as done'}">${Icon.check}</button>
          <div class="row-main" data-action="edit-task" data-id="${esc(t.id)}" style="cursor:pointer">
            <div class="row-title task-title">${esc(t.title)}</div>
            ${t.notes ? `<div class="row-sub">${esc(t.notes)}</div>` : ''}
          </div>
          ${d ? `<span class="due ${cls}">${d.label}</span>` : ''}
        </div>
      </div>
    </div>`;
}

function giftRow(g, showPerson = false) {
  const p = person(g.personId);

function giftChips() {

function giftResults() {

  const byPerson = {};
  gs.forEach(g => (byPerson[g.personId] ||= []).push(g));
  return sortedPeople().filter(p => byPerson[p.id]).map(p => {

/* =========================================================
   Navigation
   ========================================================= */
const Nav = {
  current: 'home',
  stacks: {},
  init() {
    const tabsEl = $('#tabs');
    TABS.forEach(t => {
      const el = document.createElement('section');
      el.className = 'tab'; el.dataset.tab = t.id;
      tabsEl.appendChild(el);
      this.stacks[t.id] = [];
      this.mount(t.id, { name: t.root });
    });
    $('#capsule').insertAdjacentHTML('beforeend', TABS.map(t => `<button data-action="tab" data-tab="${t.id}" aria-label="${t.label}">${Icon[t.icon]}<span>${t.label}</span></button>`).join(''));
    $('#fab').innerHTML = Icon.plus;
    let saved = null; try { saved = sessionStorage.getItem('xmas-tab'); } catch {}
    this.switchTab(TABS.some(t => t.id === saved) ? saved : 'home', true);
  },
  tabEl(id) { return $(`.tab[data-tab="${id}"]`); },
  top() { const s = this.stacks[this.current]; return s[s.length - 1]; },
  mount(tabId, route) {
    const el = createPage(route, this.stacks[tabId]);
    this.tabEl(tabId).appendChild(el);
    this.stacks[tabId].push(el);
    return el;
  },
  switchTab(id, instant) {
    if (id === this.current && !instant) {
      if (this.stacks[id].length > 1) this.popToRoot();
      else $('.scroll', this.top())?.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    this.current = id;
    try { sessionStorage.setItem('xmas-tab', id); } catch {}
    $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
    const idx = TABS.findIndex(t => t.id === id);
    $('#capsule').style.setProperty('--i', idx);
    $$('#capsule button').forEach(b => { const on = b.dataset.tab === id; b.classList.toggle('active', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); });
    updatePage(this.top());
    updateFab();
  },
  async push(route) {
    const stack = this.stacks[this.current];
    const prev = stack[stack.length - 1];
    const el = this.mount(this.current, route);
    updateFab();
    el.classList.add('offright');
    await nextFrame();
    el.classList.add('anim', 'edge-shadow'); prev.classList.add('anim');
    el.classList.remove('offright');
    prev.classList.add('under');
    await sleep(500);
    el.classList.remove('anim', 'edge-shadow'); prev.classList.remove('anim');
  },
  async pop() {
    const stack = this.stacks[this.current];
    if (stack.length < 2) return;
    const el = stack.pop();
    const prev = stack[stack.length - 1];
    updatePage(prev);
    updateFab();
    el.classList.add('anim', 'edge-shadow'); prev.classList.add('anim');
    el.style.transform = ''; prev.style.transform = '';
    await nextFrame();
    el.classList.add('offright');
    prev.classList.remove('under');
    await sleep(500);
    el.remove(); prev.classList.remove('anim');
  },
  popToRoot() {
    const stack = this.stacks[this.current];
    while (stack.length > 2) stack.splice(1, 1)[0].remove();
    this.pop();
  },
};

function updateFab() {
  const r = Nav.top()?._route;
  $('#fab').classList.toggle('hidden', !r || r.name === 'settings' || (r.name === 'person' && isMe(r.id)));
}

function createPage(route, stack) {
  const el = document.createElement('div');
  el.className = 'page';
  el._route = route;
  el._depth = stack.length;
  el._stack = stack;
  el.innerHTML = `
    <header class="navbar"><div class="nav-left"></div><div class="nav-title"></div><div class="nav-right"></div></header>
    <div class="scroll"><div class="content"></div></div>`;
  const scroll = $('.scroll', el), bar = $('.navbar', el);
  const def = Pages[route.name];
  scroll.addEventListener('scroll', () => {
    const y = scroll.scrollTop;
    bar.classList.toggle('scrolled', y > 2);
    bar.classList.toggle('collapsed', y > (def.collapseAt || 40));
  }, { passive: true });
  updatePage(el);
  return el;
}

function updatePage(el) {
  if (!el) return;
  const r = el._route, def = Pages[r.name];
  const title = def.title(r);
  const stack = el._stack || [];
  const depth = el._depth;
  const prev = depth > 0 ? stack[depth - 1] : null;
  const prevTitle = prev ? Pages[prev._route.name].title(prev._route) : '';
  $('.nav-title', el).textContent = title;
  $('.nav-left', el).innerHTML = depth > 0 ? `<button class="nav-btn back glass" data-action="back" aria-label="Back to ${esc(prevTitle)}">${Icon.back}</button>` : '';
  $('.nav-right', el).innerHTML = def.actions ? def.actions(r) : '';
  $('.content', el).innerHTML = (def.largeTitle === false ? '' : `<h1 class="large-title">${esc(title)}</h1>`) + def.render(r);
}

function renderAll() {
  Identity.check();
  Object.values(Nav.stacks).flat().forEach(updatePage);
  ui.justAdded = null;
}

/* Edge swipe to go back */
(() => {
  let s = null;
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || e.clientX > 24) return;
    const stack = Nav.stacks[Nav.current];
    if (stack.length < 2 || document.body.classList.contains('sheet-open')) return;
    s = { x: e.clientX, y: e.clientY, el: stack[stack.length - 1], prev: stack[stack.length - 2], active: false, t: performance.now() };
  });
  document.addEventListener('pointermove', e => {
    if (!s) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (!s.active) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { s = null; return; }
      if (dx < 8) return;
      s.active = true; s.el.classList.add('edge-shadow');
    }
    const x = Math.max(0, dx);
    s.el.style.transform = `translateX(${x}px)`;
    s.prev.style.transform = `translateX(${-28 + (x / innerWidth) * 28}%)`;
  });
  const end = async e => {
    if (!s) return;
    const st = s; s = null;
    if (!st.active) return;
    const dx = e.clientX - st.x;
    const v = dx / Math.max(1, performance.now() - st.t);
    if (dx > innerWidth * .4 || v > .5) Nav.pop();
    else {
      st.el.classList.add('anim'); st.prev.classList.add('anim');
      st.el.style.transform = ''; st.prev.style.transform = '';
      await sleep(500);
      st.el.classList.remove('anim', 'edge-shadow'); st.prev.classList.remove('anim');
    }
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
})();

/* Swipe-to-delete rows */
const Swipe = (() => {
  let s = null, open = null, suppressClick = false;
  const W = 88;
  const close = (c = open) => { if (!c) return; c.classList.add('snap'); c.style.transform = ''; if (c === open) open = null; };
  document.addEventListener('pointerdown', e => {
    const c = e.target.closest('.swipe-content');
    if (open && c !== open && !e.target.closest('.swipe-actions')) { close(); suppressClick = true; }
    if (!c || e.clientX < 24) return;
    s = { c, x: e.clientX, y: e.clientY, base: c === open ? -W : 0, active: false };
  });
  document.addEventListener('pointermove', e => {
    if (!s) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (!s.active) {
      if (Math.abs(dy) > 8) { s = null; return; }
      if (Math.abs(dx) < 10) return;
      s.active = true; s.c.classList.remove('snap');
    }
    let x = Math.min(0, s.base + dx);
    if (x < -W) x = -W - (Math.abs(x) - W) * .3;
    s.c.style.transform = `translateX(${x}px)`;
    s.x2 = x;
  });
  const end = () => {
    if (!s) return;
    const st = s; s = null;
    if (!st.active) return;
    suppressClick = true;
    st.c.classList.add('snap');
    if (st.x2 < -W / 2) { st.c.style.transform = `translateX(${-W}px)`; open = st.c; }
    else close(st.c);
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
  document.addEventListener('click', e => {
    if (suppressClick) { suppressClick = false; if (!e.target.closest('.swipe-actions')) { e.stopPropagation(); e.preventDefault(); } }
  }, true);
  return { closeAll: () => close() };
})();

/* =========================================================
   Sheets, action sheets, toasts
   ========================================================= */
function openSheet({ title, body, saveLabel = 'Save', onSave, onOpen, required = [] }) {
  return new Promise(resolve => {
    Swipe.closeAll();
    const back = document.createElement('div'); back.className = 'backdrop';
    const sh = document.createElement('div'); sh.className = 'sheet';
    sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true'); sh.setAttribute('aria-label', title);
    sh.innerHTML = `
      <div class="sheet-head"><h3>${esc(title)}</h3></div>
      <form class="sheet-body" autocomplete="off" novalidate>${body}<button type="submit" hidden></button></form>
      <div class="sheet-bar">
        <button class="bar-btn ghost" data-sheet="cancel">Cancel</button>
        <button class="bar-btn primary" data-sheet="save">${esc(saveLabel)}</button>
      </div>`;
    document.body.append(back, sh);
    const form = $('form', sh), saveBtn = $('[data-sheet=save]', sh);
    const validate = () => { saveBtn.disabled = required.some(n => !String(form.elements[n]?.value || '').trim()); };
    form.addEventListener('input', validate); form.addEventListener('change', validate); validate();

    let closed = false;
    const close = async result => {
      if (closed) return; closed = true;
      document.activeElement?.blur?.();
      back.classList.remove('show'); sh.classList.remove('show');
      document.body.classList.remove('sheet-open');
      await sleep(480); back.remove(); sh.remove();
      resolve(result);
    };
    const save = () => {
      if (saveBtn.disabled) return;
      const data = Object.fromEntries(new FormData(form).entries());
      if (onSave(data, form) !== false) close(data);
    };
    $('[data-sheet=cancel]', sh).onclick = () => close(null);
    saveBtn.onclick = save;
    form.onsubmit = e => { e.preventDefault(); save(); };
    back.onclick = () => close(null);
    sh._close = close;
    sh.addEventListener('keydown', e => { if (e.key === 'Escape') close(null); });
    onOpen?.(sh, close);

    const head = $('.sheet-head', sh);
    let d = null;
    head.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; d = { y: e.clientY, t: performance.now(), dy: 0 }; sh.classList.add('dragging'); head.setPointerCapture(e.pointerId); });
    head.addEventListener('pointermove', e => { if (!d) return; d.dy = Math.max(0, e.clientY - d.y); sh.style.transform = `translateY(${d.dy}px)`; });
    const up = () => {
      if (!d) return; const v = d.dy / (performance.now() - d.t);
      sh.classList.remove('dragging'); sh.style.transform = '';
      if (d.dy > 140 || v > .6) close(null);
      d = null;
    };
    head.addEventListener('pointerup', up); head.addEventListener('pointercancel', up);

    requestAnimationFrame(() => requestAnimationFrame(() => {
      back.classList.add('show'); sh.classList.add('show'); document.body.classList.add('sheet-open');
    }));
  });
}

function actionSheet({ message, actions }) {
  return new Promise(resolve => {
    const back = document.createElement('div'); back.className = 'backdrop top';
    const el = document.createElement('div'); el.className = 'action-sheet'; el.setAttribute('role', 'alertdialog');
    el.innerHTML = `
      <div class="action-group">
        ${message ? `<div class="msg">${esc(message)}</div>` : ''}
        ${actions.map((a, i) => `<button data-i="${i}" class="${a.destructive ? 'destructive' : ''}">${esc(a.label)}</button>`).join('')}
      </div>
      <div class="action-group"><button class="cancel" data-i="-1">Cancel</button></div>`;
    document.body.append(back, el);
    document.body.classList.add('menu-open');
    const close = async v => {
      back.classList.remove('show'); el.classList.remove('show');
      document.body.classList.remove('menu-open');
      await sleep(420); back.remove(); el.remove(); resolve(v);
    };
    back.onclick = () => close(-1);
    el.onclick = e => { const b = e.target.closest('button'); if (b) close(+b.dataset.i); };
    requestAnimationFrame(() => requestAnimationFrame(() => { back.classList.add('show'); el.classList.add('show'); $('.cancel', el).focus({ preventScroll: true }); }));
  });
}
const confirmDestructive = async (message, label) => (await actionSheet({ message, actions: [{ label, destructive: true }] })) === 0;

let toastTimer;
function toast(text, kind = 'ok', action) {
  const t = $('#toast');
  t.innerHTML = `${kind === 'warn' ? Icon.warn : kind === 'undo' ? Icon.trash : Icon.ok}<span>${esc(text)}</span>${action ? `<button class="toast-act">${esc(action.label)}</button>` : ''}`;
  if (action) $('.toast-act', t).onclick = () => { t.classList.remove('show'); action.run(); };
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2400);
}
/* Run a destructive change with an Undo toast that restores the previous data. */
function undoable(message, fn) {
  const snap = sanitize(JSON.parse(JSON.stringify(state)));
  commit(fn);
  toast(message, 'undo', { label: 'Undo', run: () => {
    commit(s => KINDS.forEach(k => { s[k] = snap[k].map(r => ({ ...r })); }));
    toast('Restored');
  } });
}

/* ---------- Forms ---------- */
function stepper(value, kind) {
  const i = statusIndex(value);
  const labels = KIND_STEPS[kind === 'make' ? 'make' : 'buy'];
  return `
    <div class="stepper" data-stepper style="--i:${i};--sc:var(--s-${STATUS_IDS[i]})">
      ${STATUSES.map((s, j) => `<label class="${j <= i ? 'reached' : ''} ${j === i ? 'current' : ''}">
        <input type="radio" name="status" value="${s.id}" ${j === i ? 'checked' : ''}><span class="node"></span><span class="st-l">${labels[j]}</span></label>`).join('')}
    </div>`;
}
function initStepper(root) {
  const st = $('[data-stepper]', root); if (!st) return;
  st.addEventListener('change', () => {
    const inputs = $$('input', st), i = inputs.findIndex(x => x.checked);
    st.style.setProperty('--i', i); st.style.setProperty('--sc', `var(--s-${STATUS_IDS[i]})`);
    $$('label', st).forEach((l, j) => { l.classList.toggle('reached', j <= i); l.classList.toggle('current', j === i); });
  });
}

async function deletePerson(id) {
  const p = person(id); if (!p) return false;
  if (isMe(id)) { Swipe.closeAll(); toast('This device belongs to you. Change that in Settings first.', 'warn'); return false; }
  const n = giftsFor(id).length;
  if (!await confirmDestructive(`Delete ${p.name}${n ? ` and ${n === 1 ? 'their gift' : `their ${n} gifts`}` : ''}?`, 'Delete person')) { Swipe.closeAll(); return false; }
  undoable(`Deleted ${p.name}`, s => { s.people = s.people.filter(x => x.id !== id); s.gifts = s.gifts.filter(g => g.personId !== id); });
  return true;
}
