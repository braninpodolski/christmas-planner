/* =========================================================
   Actions (event delegation)
   ========================================================= */
const Actions = {
  'tab': el => Nav.switchTab(el.dataset.tab),
  'back': () => Nav.pop(),
  'fab': () => {
    const r = Nav.top()?._route;
    if (!r) return;
    if (r.name === 'people') return personSheet();
    if (r.name === 'todo') return taskSheet();
    if (r.name === 'person') return giftSheet(null, r.id);
    return state.people.length ? giftSheet() : personSheet();
  },
  'open-settings': () => Nav.push({ name: 'settings' }),
  'open-person': el => {
    if (Nav.current !== 'people') {
      const st = Nav.stacks.people;
      while (st.length > 1) st.pop().remove();
      st[0].classList.remove('under'); st[0].style.transform = '';
      Nav.switchTab('people');
    }
    Nav.push({ name: 'person', id: el.dataset.id });
  },
  'add-person': () => personSheet(),
  'edit-person': el => personSheet(person(el.dataset.id)),
  'delete-person': el => deletePerson(el.dataset.id),
  'add-gift': el => giftSheet(null, el.dataset.person),
  'edit-gift': el => { const g = state.gifts.find(x => x.id === el.dataset.id); if (g) giftSheet(g); },
  'delete-gift': el => { const g = state.gifts.find(x => x.id === el.dataset.id); if (g) undoable(`Deleted “${g.title}”`, s => s.gifts = s.gifts.filter(x => x.id !== g.id)); },
  'cycle': (el, e) => {
    e.stopPropagation();
    const g = state.gifts.find(x => x.id === el.dataset.id); if (!g) return;
    if (g.status === 'wrapped') { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); return; }
    const next = STATUSES[statusIndex(g.status) + 1];
    commit(() => g.status = next.id, { render: false });
    $$(`[data-action=cycle][data-id="${g.id}"]`).forEach(p => {
      p.className = `status s-${next.id}`;
      const lbl = stepLabel(g.kind, next.id);
      $('.st-l', p).textContent = lbl;
      p.setAttribute('aria-label', `${lbl}. ${next.id === 'wrapped' ? 'Ready to give' : 'Tap to move to the next step'}`);
      void p.offsetWidth; p.classList.add('bump');
    });
    clearTimeout(Actions._cycleT);
    Actions._cycleT = setTimeout(renderAllPreserve, 1100);
  },
  'gift-filter': el => {
    ui.giftFilter = el.dataset.f;
    $('#giftChips').innerHTML = giftChips();
    $('#giftResults').innerHTML = giftResults();
  },
  'add-task': () => taskSheet(),
  'edit-task': el => { const t = state.tasks.find(x => x.id === el.dataset.id); if (t) taskSheet(t); },
  'delete-task': el => { const t = state.tasks.find(x => x.id === el.dataset.id); if (t) undoable('Task deleted', s => s.tasks = s.tasks.filter(x => x.id !== t.id)); },
  'toggle-task': (el, e) => {
    e.stopPropagation();
    const t = state.tasks.find(x => x.id === el.dataset.id); if (!t) return;
    commit(() => t.done = !t.done, { render: false });
    $$(`[data-task="${t.id}"]`).forEach(r => r.classList.toggle('done', t.done));
    if (t.done) sparkle(el);
    clearTimeout(Actions._taskT);
    Actions._taskT = setTimeout(renderAllPreserve, 900);
  },
  'clear-done': async () => {
    const n = state.tasks.filter(t => t.done).length; undoable(`Cleared ${plural(n, 'task')}`, s => s.tasks = s.tasks.filter(t => !t.done));
  },
  'starter-tasks': () => starterTasks(),
  'export': () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `christmas-planner-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  'import': () => $('#importFile').click(),
  'new-season': async () => {
    if (!await confirmDestructive('This deletes every gift and unchecks your to-do list. People and budgets stay. Export a backup first if you want to keep this year’s list.', 'Start next year')) return;
    undoable('Started next year', s => { s.gifts = []; s.tasks.forEach(t => t.done = false); });
  },
  'reset': async () => {
    if (!await confirmDestructive('This erases every person, gift and task, including the synced copy on your other devices.', 'Erase all data')) return;
    commit(s => KINDS.forEach(k => s[k] = []));
    toast('All data erased');
  },
  'sync-connect': () => syncSheet(),
  'sharing-on': () => shareSheet(),
  'pick-me': () => Identity.show(true),
  'sharing-off': async () => {
    if (!await confirmDestructive('Stop sharing? Every device will show all gifts again, including surprises.', 'Stop sharing')) return;
    commit(s => s.household.on = false);
  },
  'sync-now': async () => { await Sync.syncNow(true); },
  'sync-disconnect': async () => {
    if (!await confirmDestructive('Turn off sync on this device? Your data stays here and in the Gist.', 'Turn off sync')) return;
    Sync.cfg = {}; Sync.saveCfg(); renderAll();
  },
};

function renderAllPreserve() {
  if (document.activeElement?.id === 'giftSearch' && !needsIdentity()) {
    Object.values(Nav.stacks).flat().filter(p => p._route.name !== 'gifts').forEach(updatePage);
    const res = $('#giftResults'); if (res) res.innerHTML = giftResults();
    const ch = $('#giftChips'); if (ch) ch.innerHTML = giftChips();
    return;
  }
  renderAll();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = Actions[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'giftSearch') { ui.giftQuery = e.target.value; $('#giftResults').innerHTML = giftResults(); }
});
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.people) || !Array.isArray(data.gifts)) throw new Error('This file isn’t a Christmas Planner backup');
    const clean = sanitize(data);
    if (!await confirmDestructive(`Replace everything with this backup? It has ${plural(clean.people.length, 'person', 'people')} and ${plural(clean.gifts.length, 'gift')}.`, 'Replace with backup')) return;
    commit(s => KINDS.forEach(k => s[k] = clean[k]));
    toast('Backup imported');
  } catch (err) { toast(err instanceof SyntaxError ? 'This file isn’t valid JSON' : (err.message || 'Couldn’t read the file'), 'warn'); }
});

/* =========================================================
   Sync via a secret GitHub Gist
   ========================================================= */
const GIST_FILE = 'christmas-planner.json';
const GIST_DESC = 'Christmas Planner data (synced by app)';
const Sync = {
  cfg: (() => { try { const c = JSON.parse(localStorage.getItem('xmas-sync')) || {}; if (c.gistId && !/^[a-f0-9]{1,64}$/i.test(c.gistId)) delete c.gistId; return c; } catch { return {}; } })(),
  state: 'idle',
  error: '',
  timer: null,
  dirty: false,
  saveCfg() { try { localStorage.setItem('xmas-sync', JSON.stringify(this.cfg)); } catch {} },
  enabled() { return !!(this.cfg.token && this.cfg.gistId); },
  statusText() {
    if (!this.enabled()) return 'Off';
    if (this.state === 'syncing') return 'Syncing…';
    if (this.state === 'error') return this.error;
    return this.cfg.lastSync ? `Synced ${timeAgo(this.cfg.lastSync)}` : 'On';
  },
  setState(s, err = '') {
    this.state = s; this.error = err;
    const el = $('#syncStatus'); if (el) el.textContent = this.statusText();
  },
  async api(path, opts = {}) {
    const res = await fetch('https://api.github.com' + path, {
      cache: 'no-store', ...opts,
      headers: {
        Accept: 'application/vnd.github+json',
        Authorization: `Bearer ${this.cfg.token}`,
        'X-GitHub-Api-Version': '2022-11-28',
        ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
      },
    });
    if (!res.ok) {
      if (res.status === 401) throw new Error('GitHub rejected the token. Set up sync again with a new one.');
      if (res.status === 404) throw new Error('Gist not found. Check that the token has Gist access.');
      if (res.status === 403) throw new Error('The token needs Gists set to Read and write.');
      throw new Error(`GitHub returned error ${res.status}. Try again in a minute.`);
    }
    return res.json();
  },
  async connect(token) {
    this.cfg = { token: token.trim() };
    let found = null;
    for (let page = 1; page <= 5 && !found; page++) {
      const list = await this.api(`/gists?per_page=100&page=${page}`);
      found = list.find(g => g.files && g.files[GIST_FILE]);
      if (list.length < 100) break;
    }
    if (found) {
      this.cfg.gistId = found.id; this.saveCfg();
      await this.reconcile();
      this.cfg.lastSync = Date.now(); this.saveCfg();
      return 'found';
    }
    const g = await this.api('/gists', { method: 'POST', body: JSON.stringify({ description: GIST_DESC, public: false, files: { [GIST_FILE]: { content: JSON.stringify(state) } } }) });
    this.cfg.gistId = g.id; this.cfg.lastSync = Date.now(); this.saveCfg();
    return 'created';
  },
  async fetchRemote() {
    const g = await this.api(`/gists/${encodeURIComponent(this.cfg.gistId)}`);
    const f = g.files && g.files[GIST_FILE];
    if (!f) return null;
    const text = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content;
    try { return JSON.parse(text); } catch { return null; }
  },
  // Fetch the Gist, merge item-by-item with local data, then write back whichever side is behind.
  async reconcile() {
    const raw = await this.fetchRemote();
    const remote = raw && Array.isArray(raw.people) ? sanitize(raw) : null;
    const merged = remote ? merge(state, remote) : state;
    if (canon(merged) !== canon(state)) { state = merged; saveLocal(); renderAllPreserve(); }
    if (!remote || canon(merged) !== canon(remote)) await this.push();
  },
  async push() {
    await this.api(`/gists/${encodeURIComponent(this.cfg.gistId)}`, { method: 'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(state) } } }) });
  },
  schedule() {
    if (!this.enabled()) return;
    this.dirty = true;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.syncNow(), 1500);
  },
  async syncNow(manual = false) {
    if (!this.enabled()) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.setState('syncing');
    try {
      this.dirty = false;
      await this.reconcile();
      this.cfg.lastSync = Date.now(); this.saveCfg();
      this.setState('idle');
      if (manual) toast('Synced');
    } catch (err) {
      this.dirty = true;
      const msg = navigator.onLine === false ? 'Offline. Changes will sync when you’re back online.' : (err.message || 'Sync failed. Try again.');
      this.setState('error', msg);
      if (manual) toast(navigator.onLine === false ? 'You’re offline' : 'Sync failed', 'warn');
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; this.syncNow(); }
    }
  },
};
addEventListener('online', () => Sync.syncNow());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { Sync.syncNow(); refreshIfNewDay(); } });
setInterval(() => { if (document.visibilityState === 'visible') Sync.syncNow(); }, 60000);

function syncSheet() {
  return openSheet({
    title: 'Set up sync',
    saveLabel: 'Connect',
    required: ['token'],
    body: `
      <p class="fnote" style="margin:0 0 20px;font-size:15px;color:var(--text)">Sync saves your list to a secret Gist in your GitHub account. Every device with the same token sees the same list.</p>
      <div class="flabel">GitHub token</div>
      <div class="fgroup"><div class="row"><input class="field" name="token" type="password" placeholder="github_pat_…" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="GitHub token"></div></div>
      <p class="fnote">
        1. Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub’s fine-grained token page</a>.<br>
        2. Choose an expiration, like one year. Under Account permissions, set Gists to Read and write. Leave everything else off.<br>
        3. Generate the token, copy it and paste it here. Use the same token on each device.<br><br>
        The token is stored only on this device. If you’ve already set up sync on another device, this one loads that list.
      </p>`,
    onSave(d, form) {
      const sh = form.closest('.sheet'), btn = $('[data-sheet=save]', sh);
      btn.disabled = true; btn.textContent = 'Connecting…';
      Sync.connect(d.token).then(r => {
        sh._close(null); renderAll();
        toast(r === 'found' ? 'Sync is on. List loaded.' : 'Sync is on');
      }).catch(err => {
        Sync.cfg = {}; Sync.saveCfg();
        btn.disabled = false; btn.textContent = 'Connect';
        toast(err.message || 'Couldn’t connect', 'warn');
      });
      return false;
    },
  });
}

let lastDay = new Date().toDateString();
function refreshIfNewDay() {
  const d = new Date().toDateString();
  if (d !== lastDay) { lastDay = d; renderAllPreserve(); }
}
setInterval(refreshIfNewDay, 60000);
addEventListener('storage', e => { if (e.key === KEY) { state = load(); renderAllPreserve(); } });

/* Keep sheet buttons above the on-screen keyboard */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const onVV = () => {
    const kb = Math.max(0, innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', (kb > 80 ? kb - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dock-b')) || 0) : 0) + 'px');
  };
  vv.addEventListener('resize', onVV); vv.addEventListener('scroll', onVV);
}

/* =========================================================
   Household identity: who is using this device
   ========================================================= */
const Identity = {
  el: null,
  check() { if (needsIdentity()) this.show(false); else if (this.el && !this.el._manual) this.hide(); },
  show(manual) {
    if (this.el) return;
    const el = document.createElement('div');
    el.className = 'whoami'; el._manual = manual;
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'whoami-h');
    const people = sortedPeople();
    el.innerHTML = `
      <div class="whoami-inner">
        <h1 id="whoami-h">Who’s using this device?</h1>
        <p>Gifts that other people are buying for you will stay hidden here.</p>
        <div class="whoami-tags ${people.length > 3 ? 'grid' : ''}">
          ${people.map((p, i) => `<button class="shelf-tag" data-me="${esc(p.id)}" style="animation-delay:${.08 + i * .05}s">
            <span class="tag" style="--c:${p.color}"><span class="nm">${esc(p.name)}</span>${(() => { const sub = isMe(p.id) ? 'This device' : esc(p.relation); const em = p.emoji ? `<span class="em">${esc(p.emoji)}</span>` : ''; return sub || em ? `<span class="sb">${em}${sub}</span>` : ''; })()}</span>
          </button>`).join('')}
        </div>
        ${people.length ? '' : '<p>Add yourself as a person first.</p>'}
        <button class="btn quiet" data-me-add>I’m not on the list</button>
        ${manual ? '<button class="btn quiet" data-me-cancel>Cancel</button>' : ''}
      </div>`;
    document.body.appendChild(el);
    $('#app').setAttribute('inert', ''); $('#dock').setAttribute('inert', '');
    this.el = el;
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-me]');
      if (b) { setMe(b.dataset.me); this.hide(); renderAll(); toast(`Welcome, ${person(me).name}`); return; }
      if (e.target.closest('[data-me-cancel]')) { this.hide(); return; }
      if (e.target.closest('[data-me-add]')) {
        this.hide(true);
        personSheet(null, { onCreated: np => { setMe(np.id); renderAll(); } }).then(() => this.check());
      }
    });
    if (manual) requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
    else el.classList.add('show'); // first launch: cover the app immediately
  },
  async hide(keepGate) {
    const el = this.el; if (!el) return;
    this.el = null;
    el.classList.remove('show');
    $('#app').removeAttribute('inert'); $('#dock').removeAttribute('inert');
    await sleep(420); el.remove();
  },
};

function shareSheet() {
  return openSheet({
    title: 'Share your list',
    saveLabel: 'Share',
    required: ['me'],
    body: `
      <p class="fnote" style="margin:0 0 20px;font-size:15px;color:var(--text)">Use one list with your household. Each of you sees everything except the gifts the other is buying for you.</p>
      <div class="flabel">Who are you?</div>
      <div class="fgroup">
        <div class="row"><label class="lbl" for="sm">This device</label>
          <select class="field" id="sm" name="me">
            <option value="" selected disabled>Choose</option>
            ${sortedPeople().map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}
          </select>${Icon.chev}</div>
      </div>
      <p class="fnote">Not on the list? Cancel and add yourself as a person first.</p>
      <div class="flabel">Then, on the other phone</div>
      <p class="fnote" style="margin-top:0">
        1. Make sure everyone sharing is on your People list.<br>
        2. Open this app on their phone and go to Settings, then Set up sync.<br>
        3. Paste the same GitHub token you used here. The app asks who they are before it shows anything.<br><br>
        Hiding keeps surprises off each other’s screens. It isn’t encryption, so anyone with the token could still read the raw data on GitHub.
        ${Sync.enabled() ? '' : '<br><br>Sync isn’t on yet. Set it up after this so the other phone can get the list.'}
      </p>`,
    onSave(d) {
      if (!person(d.me)) return false;
      setMe(d.me);
      commit(s => s.household.on = true);
      toast('Sharing is on');
    },
  });
}

/* =========================================================
   Boot
   ========================================================= */
Nav.init();
Identity.check();
if (Sync.enabled()) Sync.syncNow();
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && location.hostname !== 'localhost') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
