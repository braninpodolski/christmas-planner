<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wish list · Gift Tags</title>
<meta name="description" content="A Gift Tags wish list">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FCFDFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1713" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(var(--safe-t) + 28px) 16px calc(var(--safe-b) + 40px); }
  .brand { color: var(--text2); font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.15; margin: 10px 0 6px; color: var(--ink); }
  .lede { color: var(--text2); margin: 0 0 20px; font-size: 15px; }
  .card { background: var(--field); border: .5px solid var(--hair); border-radius: 18px; overflow: hidden; }
  .row { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-top: .5px solid var(--hair); }
  .row:first-child { border-top: 0; }
  .what { flex: 1; min-width: 0; }
  .name { color: var(--ink); overflow-wrap: anywhere; }
  .sub { color: var(--text2); font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
  .sub a { color: var(--cranberry); text-decoration: none; }
  .mine { color: var(--pine); font-size: 14px; margin-top: 2px; }
  button { font: inherit; cursor: pointer; }
  .claim { flex: none; border: 0; border-radius: 999px; padding: 7px 14px; font-size: 15px; font-weight: 600;
           background: color-mix(in srgb, var(--cranberry) 12%, transparent); color: var(--cranberry); }
  .claim:disabled { opacity: .5; cursor: default; }
  .taken { flex: none; color: var(--text2); font-size: 15px; padding: 0 6px; }
  .undo { flex: none; border: 0; background: none; color: var(--cranberry); font-size: 15px; padding: 6px; }
  .ask { padding: 14px 16px; border-top: .5px solid var(--hair); background: var(--sunken); }
  .ask label { display: block; font-size: 14px; color: var(--text2); margin-bottom: 8px; }
  .ask .line { display: flex; gap: 8px; }
  .ask input { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 10px; border: .5px solid var(--hair); background: var(--field); color: var(--text); }
  .ask .go { border: 0; border-radius: 10px; padding: 0 16px; background: var(--cranberry); color: #fff; font-weight: 600; }
  .note { color: var(--text2); font-size: 14px; margin: 14px 4px 0; }
  .msg { color: var(--text2); text-align: center; padding: 48px 8px; }
  .err { color: var(--cranberry); font-size: 14px; margin: 12px 4px 0; min-height: 1em; }
  @media (prefers-color-scheme: dark) { .card { background: var(--sunken); } .ask { background: var(--bg); } }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><img src="icon-192.png" alt="">Gift Tags</div>
  <h1 id="title">Wish list</h1>
  <p class="lede" id="lede">Loading…</p>
  <div id="list"></div>
  <p class="err" id="err" role="status" aria-live="polite"></p>
  <p class="note" id="note" hidden>Tap “I’ll get it” on anything you’re getting, so nobody doubles up. Others see only that it’s taken, never who, and the person whose list this is never sees either.</p>
</main>
<script type="module" src="js/wish.js"></script>
</body>
</html>
